name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Cloudflare deployment secrets
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          if [ -z "$CF_API_TOKEN" ]; then
            echo "ERROR: GitHub Actions secret CLOUDFLARE_API_TOKEN is missing."
            echo "Add it in: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "$CF_ACCOUNT_ID" ]; then
            echo "ERROR: GitHub Actions secret CLOUDFLARE_ACCOUNT_ID is missing."
            echo "Add it in: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Cloudflare deployment secrets are configured."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@4

      - name: Validate Wrangler configuration
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy --dry-run

      - name: Apply remote D1 migrations
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply contentmanagement --remote

      - name: Deploy Worker
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

      - name: Verify Worker health endpoint
        run: |
          set -e
          URL="https://contentmanagement-api.rubel-bhd1.workers.dev/api/health"
          echo "Checking $URL"
          for i in 1 2 3 4 5; do
            STATUS=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$URL" || true)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          echo "Worker health check failed."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
